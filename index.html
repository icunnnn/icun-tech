<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jadwal Kuliah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fcf0ff;--surface:#fff;--ink:#43225f;--muted:#9068b0;--line:#f1d2fb;--accent:#a93fdc;--accent2:#e2489f;--accent-ink:#fff;--soft:#f7e0ff;--blush:#ffe2f1;
--warn:#bf2f4b;--warn-bg:#ffe3e8;--swap:#955700;--swap-bg:#fff0cc;--exam:#1b66ad;--exam-bg:#dcecfb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#22112f;--surface:#341b47;--ink:#ffeefa;--muted:#d8b0ee;--line:#55306d;--accent:#dba5ff;--accent2:#ff8fcf;--accent-ink:#2a0f3c;--soft:#452059;--blush:#52214a;--warn:#ff9fb0;--warn-bg:#4a1c28;--swap:#f6c868;--swap-bg:#46321a;--exam:#8cc4ff;--exam-bg:#1a3550}}
:root[data-theme="dark"]{--bg:#22112f;--surface:#341b47;--ink:#ffeefa;--muted:#d8b0ee;--line:#55306d;--accent:#dba5ff;--accent2:#ff8fcf;--accent-ink:#2a0f3c;--soft:#452059;--blush:#52214a;--warn:#ff9fb0;--warn-bg:#4a1c28;--swap:#f6c868;--swap-bg:#46321a;--exam:#8cc4ff;--exam-bg:#1a3550}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--ink);font:600 16px/1.5 "Quicksand",system-ui,-apple-system,"Segoe UI",sans-serif;
background:radial-gradient(420px 300px at 100% 0,var(--blush),transparent 70%),radial-gradient(420px 320px at 0 60%,var(--soft),transparent 70%),radial-gradient(380px 300px at 100% 100%,var(--blush),transparent 70%),var(--bg);background-attachment:fixed}
main{max-width:640px;margin:0 auto;padding:20px 16px 44px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
header h1{margin:0;font-size:16px;font-weight:700;color:var(--accent)}
header p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.hero{margin:16px 0 14px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.hero h2{margin:0;font:400 clamp(40px,12vw,58px)/1.1 "Pacifico",cursive;background:linear-gradient(100deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
.hero h2::after{content:"✨";font-size:.45em;margin-left:6px;-webkit-text-fill-color:initial}
.hero .sub{margin:4px 0 0;color:var(--muted);font-size:15px}
.nav{display:flex;gap:6px}
.nav button{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-size:18px;color:var(--accent);font-weight:700}
.nav button.today{width:auto;white-space:nowrap;padding:0 16px;border-radius:22px;font-size:14px;font-weight:700;background:linear-gradient(120deg,var(--accent),var(--accent2));border-color:transparent;color:var(--accent-ink)}
.now{position:relative;margin:0 0 16px;padding:14px 56px 14px 18px;border-radius:26px;background:linear-gradient(120deg,var(--accent),var(--accent2));color:var(--accent-ink);font-weight:700;box-shadow:0 10px 22px -10px var(--accent2)}
.now::after{content:"💫";position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:26px}
.now small{display:block;font-weight:600;opacity:.92}
.week{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:22px}
.week button{border:2px solid var(--line);background:var(--surface);border-radius:20px;padding:8px 0 6px;text-align:center;min-height:60px}
.week b{display:block;font-size:17px}
.week span{font-size:12px;color:var(--muted)}
.week i{display:block;height:12px;margin-top:1px;font-style:normal;font-size:10px;line-height:12px;color:var(--accent2)}
.week .has i::before{content:"♥"}
.week .sel{background:linear-gradient(160deg,var(--accent),var(--accent2));border-color:transparent;color:var(--accent-ink)}
.week .sel span,.week .sel i{color:var(--accent-ink)}.week .sel span{opacity:.92}
.week .tdy:not(.sel){border-color:var(--accent2);border-style:dashed}
ol{list-style:none;margin:0;padding:0}
.s{display:grid;grid-template-columns:62px 1fr;gap:10px}
.t{font-variant-numeric:tabular-nums;text-align:right;padding-top:12px;line-height:1.25}
.t b{display:inline-block;font-size:15px;padding:1px 9px;border-radius:99px;background:var(--soft);color:var(--accent)}.t span{display:block;margin-right:9px;font-size:12px;color:var(--muted)}
.c{position:relative;background:var(--surface);border:3px solid var(--surface);border-radius:26px;padding:12px 16px 12px 62px;margin-bottom:12px;box-shadow:0 6px 18px -8px var(--accent2),0 0 0 2px var(--line)}
.ic{position:absolute;left:12px;top:12px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:19px;background:var(--soft)}
.c h3{margin:0;font-size:17px;line-height:1.3;font-weight:700}
.c p{margin:3px 0 0;font-size:14px;color:var(--muted)}
.tag{display:inline-block;margin:0 6px 4px 0;padding:1px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--blush);color:var(--accent2)}
.c.ditunda .ic{background:var(--warn-bg)}.c.ditunda h3{text-decoration:line-through;color:var(--muted)}
.c.ganti .ic{background:var(--swap-bg)}.c.ujian .ic{background:var(--exam-bg)}
.tag.ditunda{background:var(--warn-bg);color:var(--warn)}.tag.ganti{background:var(--swap-bg);color:var(--swap)}.tag.ujian{background:var(--exam-bg);color:var(--exam)}
.s.live .c{box-shadow:0 0 0 3px var(--accent2),0 8px 22px -8px var(--accent2)}
.empty{padding:30px 16px;text-align:center;color:var(--muted);border:3px dotted var(--line);border-radius:26px;background:var(--surface)}
.forum{margin-top:22px}.forum h4{margin:0 0 6px;font-size:15px;color:var(--accent)}
.forum li{padding:8px 0;border-top:2px dotted var(--line);font-size:14px;color:var(--muted)}
footer{margin-top:30px;font-size:13px;color:var(--muted)}
footer a{color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.week button{transition:transform .15s}.week button:active{transform:scale(.93)}}
</style>
</head>
<body>
<main>
<header><h1 id="kelas">Jadwal kuliah</h1><p id="room"></p></header>
<div class="hero"><div><h2 id="day"></h2><p class="sub" id="sub"></p></div>
<div class="nav"><button id="prev" aria-label="Hari sebelumnya">‹</button><button id="today" class="today">Hari ini</button><button id="next" aria-label="Hari berikutnya">›</button></div></div>
<div id="now"></div>
<div class="week" id="week" role="group" aria-label="Pilih hari"></div>
<section id="list" aria-live="polite"></section>
<footer id="foot"></footer>
</main>
<script>
const ICON={kuliah:"📖",kkd:"🩺",sgd:"💬",praktikum:"🔬",tes:"📝",ujian:"🎀",tugas:"📌"};
const JENIS={kkd:"KKD",sgd:"SGD",praktikum:"Praktikum",tes:"Tes",ujian:"Ujian",tugas:"Tugas"};
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const fmt=(d,o)=>d.toLocaleDateString("id-ID",o);
let D,byDate={},sel;
const mins=t=>{const[h,m]=t.split(":").map(Number);return h*60+m};
const pad=t=>t.replace(/^(\d):/,"0$1:");

function weekOf(d){const m=new Date(d);m.setDate(d.getDate()-((d.getDay()+6)%7));return[...Array(6)].map((_,i)=>{const x=new Date(m);x.setDate(m.getDate()+i);return x})}
function nowLine(day,isToday){
  if(!isToday||!day){return""}
  const n=new Date(),cur=n.getHours()*60+n.getMinutes();
  const act=day.sesi.filter(s=>s.status!=="ditunda");
  const live=act.find(s=>mins(s.mulai)<=cur&&cur<mins(s.selesai));
  if(live)return`<div class="now">Sedang berlangsung: ${esc(live.judul)}<small>sampai ${pad(live.selesai)}</small></div>`;
  const nx=act.find(s=>mins(s.mulai)>cur);
  if(nx)return`<div class="now">Berikutnya: ${esc(nx.judul)}<small>pukul ${pad(nx.mulai)}</small></div>`;
  return act.length?`<div class="now">Kuliah hari ini sudah selesai</div>`:"";
}
function render(){
  const d=parse(sel),day=byDate[sel],todayIso=iso(new Date()),isToday=sel===todayIso;
  $("day").textContent=fmt(d,{weekday:"long"});
  const n=day?day.sesi.length:0;
  $("sub").textContent=fmt(d,{day:"numeric",month:"long",year:"numeric"})+(day&&day.catatan?" · "+day.catatan:"")+(n?" · "+n+" sesi":"");
  $("now").innerHTML=nowLine(day,isToday);
  $("week").innerHTML=weekOf(d).map(x=>{const k=iso(x),h=byDate[k]&&byDate[k].sesi.length;
    return`<button data-d="${k}" class="${h?"has ":""}${k===sel?"sel ":""}${k===todayIso?"tdy":""}" aria-pressed="${k===sel}"><span>${fmt(x,{weekday:"short"})}</span><b>${x.getDate()}</b><i></i></button>`}).join("");
  const cur=new Date(),cm=cur.getHours()*60+cur.getMinutes();
  let h="";
  if(day&&day.sesi.length){
    h+="<ol>"+day.sesi.map(s=>{
      const live=isToday&&s.status!=="ditunda"&&mins(s.mulai)<=cm&&cm<mins(s.selesai);
      const tags=(s.status==="ditunda"?'<span class="tag ditunda">Ditunda</span>':s.status==="ganti"?'<span class="tag ganti">Kuliah pengganti</span>':"")+(JENIS[s.jenis]?`<span class="tag ${s.jenis==="ujian"?"ujian":""}">${JENIS[s.jenis]}</span>`:"");
      return`<li class="s${live?" live":""}"><div class="t"><b>${pad(s.mulai)}</b><span>${pad(s.selesai)}</span></div><div class="c ${s.status} ${s.jenis==="ujian"?"ujian":""}"><span class="ic">${s.status==="ditunda"?"⏸️":s.status==="ganti"?"🔁":(ICON[s.jenis]||"📖")}</span>${tags}<h3>${esc(s.judul)}</h3>${s.dosen?`<p>${esc(s.dosen)}</p>`:""}</div></li>`}).join("")+"</ol>";
  }else h+=`<div class="empty">${day?"Tidak ada sesi hari ini, waktunya santai 🦋":"Jadwal untuk tanggal ini belum diisi fakultas."}</div>`;
  if(day&&day.forum.length)h+=`<div class="forum"><h4>Diskusi forum (daring)</h4><ul style="list-style:none;padding:0;margin:0">${day.forum.map(f=>`<li>${esc(f)}</li>`).join("")}</ul></div>`;
  $("list").innerHTML=h;
}
function go(k){sel=k;render()}
function step(dir){const ks=Object.keys(byDate).sort();
  if(dir>0){const nx=ks.find(k=>k>sel&&byDate[k].sesi.length);if(nx)go(nx)}else{const pv=[...ks].reverse().find(k=>k<sel&&byDate[k].sesi.length);if(pv)go(pv)}}
function init(data){
  D=data;D.hari.forEach(x=>byDate[x.tanggal]=x);
  $("kelas").textContent="🎀 Jadwal kuliah "+D.meta.kelas;document.title="Jadwal kuliah "+D.meta.kelas;$("room").textContent=D.meta.ruang;
  const ks=Object.keys(byDate).sort(),t=iso(new Date());
  sel=byDate[t]?t:(ks.find(k=>k>t&&byDate[k].sesi.length)||ks.filter(k=>byDate[k].sesi.length).pop()||ks[0]);
  const up=D.meta.diperbarui?fmt(new Date(D.meta.diperbarui),{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"}):"";
  $("foot").innerHTML=(up?`Jadwal terakhir berubah: ${up}. `:"")+`Data diambil otomatis dari <a href="${esc(D.meta.sumber)}" rel="noopener">dokumen resmi fakultas</a>. Jika ada perbedaan, dokumen resmi yang berlaku. nana plenger`;
  $("prev").onclick=()=>step(-1);$("next").onclick=()=>step(1);
  $("today").onclick=()=>{const k=iso(new Date());go(k)};
  $("week").onclick=e=>{const b=e.target.closest("button");if(b)go(b.dataset.d)};
  render();setInterval(()=>{if(sel===iso(new Date()))render()},60000);
}
(window.__JADWAL__?Promise.resolve(window.__JADWAL__):fetch("jadwal.json",{cache:"no-cache"}).then(r=>r.json()))
  .then(init).catch(()=>{$("list").innerHTML='<div class="empty">Jadwal gagal dimuat. Coba muat ulang halaman.</div>'});
</script>
</body>
</html>
